name: reproduce

# Rebuild a pinned vendor image and compare it with the vendor's release.
# Runs when the build inputs or tools change in a pull request, or by hand.
# A build takes 5-10 minutes per runner.
on:
  pull_request:
    paths:
      - "pins/**"
      - "studio/**"
      - ".github/workflows/reproduce.yml"
  workflow_dispatch:
    inputs:
      pins:
        description: "Pins file"
        default: "pins/quinled-16.0.1.json"
      target:
        description: "Target (PlatformIO env)"
        default: "dig-next-2"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build and compare
        shell: bash
        # A short work path on Windows: the compiler command lines carry many
        # include paths and exceed Windows' limit under D:\a\<repo>\<repo>\...
        # ("CreateProcess: No such file or directory").
        run: |
          work=work
          if [ "$RUNNER_OS" = "Windows" ]; then work="C:/w"; fi
          python studio/build.py "${{ inputs.pins || 'pins/quinled-16.0.1.json' }}" --target "${{ inputs.target || 'dig-next-2' }}" --check --work "$work" --out out/result
      - name: Report
        if: always()
        shell: bash
        run: cat out/result/build-report.json || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-${{ matrix.os }}
          path: |
            out/result/build-report.json
            out/result/firmware.bin
            out/result/firmware.elf
          if-no-files-found: ignore
