name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile studio/*.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Pins files are valid JSON
        run: for f in pins/*.json; do python -m json.tool "$f" > /dev/null; done
