name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile studio/*.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Pins files are valid JSON
        run: for f in pins/*.json; do python -m json.tool "$f" > /dev/null; done

  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 7.0.1
          "$RUNNER_TEMP/emsdk/emsdk" activate 7.0.1
      - name: Compile the example effect to WebAssembly and test the frames
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          preview/build.sh "$RUNNER_TEMP/preview" examples/usermods/studio_example_fx
          PREVIEW_DIR="$RUNNER_TEMP/preview" node --test preview/test/preview.test.mjs
          preview/build.sh "$RUNNER_TEMP/sound" preview/test/sound_probe
          SOUND_DIR="$RUNNER_TEMP/sound" node --test preview/test/sound.test.mjs
      - name: Exact colours, with WLED's own colour code from the pinned checkout
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          read -r repo commit < <(python3 -c 'import json; w = json.load(open("pins/quinled-16.0.1.json"))["wled"]; print(w["repo"], w["commit"])')
          src="$RUNNER_TEMP/wled"
          git init -q "$src" && git -C "$src" fetch -q --depth 1 "$repo" "$commit" && git -C "$src" checkout -q FETCH_HEAD
          WLED_SRC="$src" preview/build.sh "$RUNNER_TEMP/exact" preview/test/palette_probe
          preview/build.sh "$RUNNER_TEMP/approx" preview/test/palette_probe
          WLED_SRC="$src" EXACT_DIR="$RUNNER_TEMP/exact" APPROX_DIR="$RUNNER_TEMP/approx" node --test preview/test/palettes.test.mjs
          WLED_SRC="$src" preview/build.sh "$RUNNER_TEMP/exact-fx" examples/usermods/studio_example_fx
          PREVIEW_DIR="$RUNNER_TEMP/exact-fx" node --test preview/test/preview.test.mjs
      - name: Virtual WLED, WLED's own engine, with the example usermod
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          # the Dig-Next-2's flags that shape the effect list (the gate will take them from the build)
          export VIRTUAL_FLAGS="-DUSERMOD_AUDIOREACTIVE -DWLED_PS_DONT_REPLACE_FX -DWLED_ENABLE_GIF -DBOARD_HAS_PSRAM"
          virtual/build.sh "$RUNNER_TEMP/virtual" "$RUNNER_TEMP/wled" examples/usermods/studio_example_fx
          VIRTUAL_DIR="$RUNNER_TEMP/virtual" node --test virtual/test/smoke.test.mjs
          PREVIEW_DIR="$RUNNER_TEMP/virtual" node --test preview/test/preview.test.mjs
          # the device server: WLED's API over the twin
          VIRTUAL_DIR="$RUNNER_TEMP/virtual" node --test virtual/test/server.test.mjs
          # the gate must be seen to fail: an effect that crashes fails the smoke test
          virtual/build.sh "$RUNNER_TEMP/virtual-crash" "$RUNNER_TEMP/wled" virtual/test/crash_probe
          if VIRTUAL_DIR="$RUNNER_TEMP/virtual-crash" node --test virtual/test/smoke.test.mjs > "$RUNNER_TEMP/crash.log" 2>&1; then
            echo "the crash probe passed the smoke test: the gate can't fail"; exit 1
          fi
          grep -q "Crash Probe" "$RUNNER_TEMP/crash.log" && echo "the crash probe fails the smoke test, by name"

