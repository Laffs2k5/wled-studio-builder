name: virtual-image

# Build the virtual WLED device's image (virtual/Dockerfile), stock and with the example usermod,
# run each, and check that it answers as a WLED with WLED's effects (and the usermod's). Builds
# and tests only: nothing is published.
on:
  push:
    branches: [main]
    paths: ["virtual/**", "preview/**", "pins/**", ".dockerignore", ".github/workflows/virtual-image.yml"]
  pull_request:
    paths: ["virtual/**", "preview/**", "pins/**", ".dockerignore", ".github/workflows/virtual-image.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, stock (QuinLED's 16.0.1 for the Dig-Next-2)
        run: docker build -f virtual/Dockerfile -t wled-virtual:stock .
      - name: Build, with the example usermod
        run: docker build -f virtual/Dockerfile --build-context usermods=examples/usermods/studio_example_fx -t wled-virtual:custom .
      - name: Run both and check them as WLED devices
        run: |
          set -eu
          check() {   # image port expected-effect
            printf 1234 > "$RUNNER_TEMP/pin"; chmod 644 "$RUNNER_TEMP/pin"
            docker run -d --name "v$2" -p "127.0.0.1:$2:8080" --read-only --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /data:uid=10001 -e LEDS=124,126 -e NAME=ci -e PIN_FILE=/run/pin \
              -v "$RUNNER_TEMP/pin:/run/pin:ro" "$1"
            for _ in $(seq 30); do curl -fsS "http://127.0.0.1:$2/json/info" > /dev/null 2>&1 && break; sleep 1; done
            docker logs "v$2"
            curl -fsS "http://127.0.0.1:$2/json/info" | python3 -c '
          import json, sys
          i = json.load(sys.stdin)
          assert i["arch"] == "virtual" and i["leds"]["count"] == 250 and i["ver"] == "16.0.1", i
          print("info:", i["virtual"]["firmware"], i["fxcount"], "effects")'
            curl -fsS "http://127.0.0.1:$2/json/eff" | python3 -c "
          import json, sys
          e = json.load(sys.stdin)
          assert '$3' in e, '$3 missing'
          print('effects include $3')"
            curl -fsS -X POST "http://127.0.0.1:$2/json/state" -d '{"bri":20,"v":true}' | python3 -c '
          import json, sys
          assert json.load(sys.stdin)["bri"] == 20
          print("state: set and read back")'
            code=$(curl -s -o /dev/null -w '%{http_code}' -F 'data=@/dev/null;filename=presets.json' "http://127.0.0.1:$2/upload")
            [ "$code" = 401 ] && echo "upload refused without the PIN"
            sleep 35; docker inspect -f '{{.State.Health.Status}}' "v$2" | grep -qx healthy && echo "healthy"
            docker rm -f "v$2" > /dev/null
          }
          check wled-virtual:stock 18080 "Fireworks 1D"
          check wled-virtual:custom 18081 "Studio Comet"
      - name: Image size
        run: docker image ls wled-virtual
